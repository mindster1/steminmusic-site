name: Fetch photos from Bandzoogle

# Copies every photo listed in images.txt from the old Bandzoogle site into img/,
# makes a smaller 800px copy of each for phones, and commits them.
# Runs once when images.txt changes, or manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths: [images.txt, .github/workflows/fetch-photos.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Download photos
        run: |
          mkdir -p img
          while read -r name url; do
            [ -z "$name" ] && continue
            if [ -s "img/$name" ]; then echo "have $name"; continue; fi
            echo "downloading $name"
            curl -fsSL --retry 3 -o "img/$name" "$url" || echo "FAILED $name"
          done < images.txt
      - name: Make phone-sized copies
        run: |
          for f in img/*.jpg img/*.jpeg; do
            [ -e "$f" ] || continue
            case "$f" in *-800.*) continue;; esac
            ext="${f##*.}"; small="${f%.*}-800.$ext"
            [ -s "$small" ] || convert "$f" -auto-orient -resize '800x>' -quality 82 -strip -interlace Plane "$small"
          done
          ls img | wc -l
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add img
          git diff --cached --quiet && echo "nothing new" || (git commit -m "Add photos from Bandzoogle" && git push)

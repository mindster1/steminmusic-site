name: Fetch press photos from Google Drive

# Downloads the press photos listed in press/photos.txt (Drive file IDs, shared
# "anyone with the link"), makes web previews (1600px + 800px) and commits them.
# The full-resolution originals stay on Google Drive; the press page links to them.
on:
  workflow_dispatch:
  push:
    paths: [press/photos.txt, .github/workflows/fetch-press-photos.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Download and resize
        run: |
          mkdir -p /tmp/orig
          while read -r name id credit; do
            [ -z "$name" ] && continue
            if [ -s "press/$name" ]; then echo "have $name"; continue; fi
            echo "downloading $name ($id)"
            curl -fsSL --retry 3 -o "/tmp/orig/$name" "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t" || { echo "FAILED $name"; continue; }
            file "/tmp/orig/$name"
            convert "/tmp/orig/$name" -auto-orient -resize '1600x1600>' -quality 82 -strip -interlace Plane "press/$name"
            convert "/tmp/orig/$name" -auto-orient -resize '800x800>' -quality 80 -strip -interlace Plane "press/${name%.jpg}-800.jpg"
          done < press/photos.txt
          ls -la press
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add press
          git diff --cached --quiet && echo "nothing new" || (git commit -m "Add press photos from Google Drive" && git push)

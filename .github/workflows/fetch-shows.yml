name: Update shows from Bandsintown

# Every 6 hours (and on demand) fetch Stemin's upcoming shows from Bandsintown
# and save them to data/shows.json, which the website reads. Commits only on change.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths: [.github/workflows/fetch-shows.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch events
        run: |
          set -e
          mkdir -p data
          for id in "steminmusic.com" "js_steminmusic.com"; do
            code=$(curl -s -o /tmp/ev.json -w "%{http_code}" "https://rest.bandsintown.com/artists/Stemin/events?app_id=$id&date=upcoming")
            echo "app_id=$id -> HTTP $code"; head -c 400 /tmp/ev.json; echo
            if [ "$code" = "200" ] && python3 -c "import json,sys; d=json.load(open('/tmp/ev.json')); sys.exit(0 if isinstance(d,list) else 1)"; then ok=1; break; fi
          done
          [ -n "$ok" ] || { echo "Bandsintown not reachable"; exit 1; }
          python3 - <<'PY'
          import json
          ev=json.load(open('/tmp/ev.json'))
          out=[]
          for e in ev:
              v=e.get('venue') or {}
              offers=e.get('offers') or []
              out.append({
                "datetime": e.get("datetime"),
                "title": e.get("title") or "",
                "venue": v.get("name",""),
                "city": v.get("city",""),
                "country": v.get("country",""),
                "url": e.get("url",""),
                "ticket": (offers[0].get("url") if offers else ""),
                "free": bool(e.get("free")) if "free" in e else False,
              })
          json.dump(out, open('data/shows.json','w'), indent=1, ensure_ascii=False)
          print(json.dumps(out, indent=1, ensure_ascii=False)[:1500])
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/shows.json
          git diff --cached --quiet && echo "no change" || (git commit -m "Update shows from Bandsintown" && git push)
